# Production stack for Hostinger VPS 62.72.7.218
#
# TLS and :80/:443 are owned by the host's systemd Caddy (shared with
# gustale.com, komputer.shop, n8n). This stack therefore publishes only to
# 127.0.0.1 and never binds a public port — see deploy/caddy/nusa.business.caddy
# for the site blocks the host Caddy needs.

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      NUSA_DATA_DIR: /data
      # Required. Deploy aborts if unset — see docs/ops/vps-deploy.md.
      NUSA_AUTH_SECRET: ${NUSA_AUTH_SECRET:?NUSA_AUTH_SECRET must be set}
    volumes:
      - api_data:/data
    ports:
      - "127.0.0.1:4101:8787"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_BROWSER_API_URL: ${PUBLIC_BROWSER_API_URL:-https://api.nusa.business}
        PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://portal.nusa.business}
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      # Server-only — never bake Compose DNS into client scripts.
      NUSA_SSR_API_URL: "http://api:8787"
      PUBLIC_BROWSER_API_URL: ${PUBLIC_BROWSER_API_URL:-https://api.nusa.business}
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://portal.nusa.business}
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      - api

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.nusa.business}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4103:8080"

volumes:
  api_data:
