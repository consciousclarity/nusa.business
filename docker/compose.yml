services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nusa
      POSTGRES_PASSWORD: nusa
      POSTGRES_DB: nusa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nusa
      MINIO_ROOT_PASSWORD: nusaminiopass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  # Mercur/Medusa marketplace — enable when ready to wire vendor UUIDs
  # mercur:
  #   image: ghcr.io/mercurjs/mercur:latest
  #   depends_on: [postgres, redis]
  #   environment:
  #     DATABASE_URL: postgres://nusa:nusa@postgres:5432/mercur
  #   ports:
  #     - "9002:9000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  meili:
  minio:
