name: Bug report
description: Something broken in Nusa.Business
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL / host
      placeholder: "http://localhost:4321/host/gianyar.bali/..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public web
        - Portal
        - API
        - Seed / data
        - Docker / deploy
        - Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
