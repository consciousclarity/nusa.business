name: Feature request
description: New capability for the directory, marketplace or geo platform
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: parity
    attributes:
      label: Parity map
      options:
        - Directory
        - Booking
        - Marketplace
        - Geo / tenancy
        - Field ops
        - Other / net-new
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
