name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions runs on Node 24. v4 targets Node 20, which is
      # deprecated on GitHub-hosted runners and is currently force-upgraded
      # with a warning.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck / build API
        run: npm run build -w @nusa/api
      - name: Build portal
        run: npm run build -w @nusa/portal
      - name: Build web
        run: npm run build -w @nusa/web
      - name: Test
        # Packages and the API are already built above; pretest is a no-op
        # rebuild that keeps `npm test` self-sufficient for humans too.
        run: npm test
      - name: Seed smoke check
        run: npm run seed
