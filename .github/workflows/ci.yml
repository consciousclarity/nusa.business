name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck / build API
        run: npm run build -w @nusa/api
      - name: Build portal
        run: npm run build -w @nusa/portal
      - name: Build web
        run: npm run build -w @nusa/web
