name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck / build API
        run: npm run build -w @nusa/api
      - name: Build portal
        run: npm run build -w @nusa/portal
      - name: Build web
        run: npm run build -w @nusa/web
      - name: Test
        run: npm test
      - name: Seed smoke check
        run: npm run seed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Build packages
        run: npm run build:packages
      - name: Build web
        run: npm run build -w @nusa/web
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy web to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/web/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/nusa.business/
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key